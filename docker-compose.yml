services:

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/fleethub
      ML_SERVICE_URL: http://ml_service:8000
    depends_on:
      db:
        condition: service_healthy
      ml_service:
        condition: service_started

  ml_service:
    build:
      context: ./ml_service
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      HOST: "0.0.0.0"


  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fleethub
    ports:
      - "5433:5432"
    volumes:
     - postgres_data:/var/lib/postgresql/data
     - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
     - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fleethub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: